{% load static %}
<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light">
  <title>تسجيل الدخول - Equatorial</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: #1f2733; font-family: sans-serif;
    }
    .card {
      background: #fff; width: 100%; max-width: 380px; padding: 32px;
      border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    .brand { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 4px; color: #1f2733; }
    .sub { text-align: center; color: #7a8699; margin-bottom: 24px; font-size: 14px; }
    label { display: block; font-size: 13px; color: #445; margin: 14px 0 6px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 11px 12px; border: 1px solid #cfd6e0;
      border-radius: 8px; font-size: 15px; color: #212529; background: #fff;
    }
    input:focus { outline: none; border-color: #2b6cb0; box-shadow: 0 0 0 3px rgba(43,108,176,.15); }
    button {
      width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 8px;
      background: #2b6cb0; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #245a94; }
    .error { background: #fde8e8; color: #9b1c1c; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="">
    {% csrf_token %}
    <div class="brand">Equatorial</div>
    <div class="sub">نظام إدارة المبيعات</div>

    {% if form.errors %}
      <div class="error">اسم المستخدم أو كلمة المرور غير صحيحة.</div>
    {% endif %}

    <label for="id_username">اسم المستخدم</label>
    <input type="text" name="username" id="id_username" autofocus required>

    <label for="id_password">كلمة المرور</label>
    <input type="password" name="password" id="id_password" required>

    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">تسجيل الدخول</button>
  </form>
</body>
</html>
